<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Pavitra &amp; Ramon</title>
  <!-- The rising sun from the mural, cut down until it still reads at 16px:
       seven thick rays instead of nineteen thin ones, and no monogram (a 'P&R'
       in Marcellus turns to mud below 32px). -->
  <rect width="64" height="64" fill="#0C0B0A"/>
  <rect x="3.5" y="3.5" width="57" height="57" fill="none" stroke="#C8A75C" stroke-width="2"/>
  <rect x="8" y="8" width="48" height="48" fill="none" stroke="#C8A75C" stroke-width="1" stroke-opacity=".45"/>
  <g stroke="#E2C88A" stroke-width="2.6" stroke-linecap="round">
    <path d="M32 27 V16"/>
    <path d="M25.4 28.8 L19.9 19.3"/>
    <path d="M38.6 28.8 L44.1 19.3"/>
    <path d="M20.6 33.4 L11.1 27.9"/>
    <path d="M43.4 33.4 L52.9 27.9"/>
  </g>
  <path d="M20 40 A12 12 0 0 1 44 40 Z" fill="#C8A75C"/>
  <path d="M13 42.5 H51" stroke="#C8A75C" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M17 47.5 H47" stroke="#C8A75C" stroke-width="1.6" stroke-opacity=".6" stroke-linecap="round"/>
</svg>
